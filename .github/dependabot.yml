version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-toolkit:
        patterns:
          - '@actions/*'
      ai-sdk:
        patterns:
          - '@ai-sdk/*'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
